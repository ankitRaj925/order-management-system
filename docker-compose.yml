services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms123
      POSTGRES_DB: omsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d omsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omsdb
      SPRING_DATASOURCE_USERNAME: oms
      SPRING_DATASOURCE_PASSWORD: oms123
    ports:
      - "8080:8080"

volumes:
  pgdata: