<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Management System</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #222; }
        .container { max-width: 900px; margin: auto; }
        h1 { margin-top: 0; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input { flex: 1; min-width: 140px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #64748b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
        th { background: #f1f5f9; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; background: #dbeafe; color: #1e40af; }
        .badge.CONFIRMED { background: #fef3c7; color: #92400e; }
        .badge.SHIPPED { background: #dcfce7; color: #166534; }
        .msg { margin-top: 10px; font-size: 14px; }
        .error { color: #b91c1c; }
        .ok { color: #166534; }
    </style>
</head>
<body>
<div class="container">
    <h1>Order Management System</h1>

    <div class="card">
        <h3>Create Order</h3>
        <div class="form-row">
            <input id="customerName" placeholder="Customer name">
            <input id="productName" placeholder="Product">
            <input id="quantity" type="number" min="1" placeholder="Quantity">
            <input id="price" type="number" min="0" step="0.01" placeholder="Price">
            <button onclick="createOrder()">Create</button>
        </div>
        <div id="message" class="msg"></div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Orders</h3>
            <button class="secondary" onclick="loadOrders()">Refresh</button>
        </div>
        <table>
            <thead>
            <tr><th>ID</th><th>Customer</th><th>Product</th><th>Qty</th><th>Price</th><th>Status</th><th>Created</th></tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>
</div>

<script>
    function showMessage(text, isError) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'msg ' + (isError ? 'error' : 'ok');
    }

    async function loadOrders() {
      try {
        const res = await fetch('/orders');
        const orders = await res.json();
        const body = document.getElementById('ordersBody');
        body.innerHTML = '';
        orders.sort((a, b) => b.id - a.id).forEach(o => {
          const tr = document.createElement('tr');
          const cells = [o.id, o.customerName, o.productName, o.quantity, o.price];
          cells.forEach(v => {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          });
          const statusTd = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = 'badge ' + o.status;
          badge.textContent = o.status;
          statusTd.appendChild(badge);
          tr.appendChild(statusTd);
          const timeTd = document.createElement('td');
          timeTd.textContent = new Date(o.createdAt).toLocaleString();
          tr.appendChild(timeTd);
          body.appendChild(tr);
        });
      } catch (e) {
        showMessage('Could not load orders', true);
      }
    }

    async function createOrder() {
      const order = {
        customerName: document.getElementById('customerName').value.trim(),
        productName: document.getElementById('productName').value.trim(),
        quantity: parseInt(document.getElementById('quantity').value),
        price: parseFloat(document.getElementById('price').value)
      };
      if (!order.customerName || !order.productName || !order.quantity || !order.price) {
        showMessage('Please fill all fields', true);
        return;
      }
      try {
        const res = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(order)
        });
        if (!res.ok) throw new Error();
        const saved = await res.json();
        showMessage('Order #' + saved.id + ' created', false);
        ['customerName', 'productName', 'quantity', 'price'].forEach(id => document.getElementById(id).value = '');
        loadOrders();
      } catch (e) {
        showMessage('Failed to create order', true);
      }
    }

    loadOrders();
    setInterval(loadOrders, 3000);
</script>
</body>
</html>
