spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/omsdb
spring.datasource.username=oms
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info,prometheus
management.server.port=8081

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-processor
spring.kafka.consumer.auto-offset-reset=earliest
# Admin credentials must be supplied through environment variables. No insecure defaults.
app.admin-username=${ADMIN_USERNAME:}
app.admin-password=${ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.jpa.show-sql=false
